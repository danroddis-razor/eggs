<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eggs — Clients</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="clients-page">
  <header class="egg-header">
    <span class="egg-emoji" aria-hidden="true">🥚</span>
    <h1 class="egg-word">Eggs</h1>
  </header>
  <main>
    <form class="new-client" id="new-client">
      <label for="client-name">Client name</label>
      <input type="text" id="client-name" name="client-name" autocomplete="off" maxlength="100">
      <button type="button" id="add-client">Add client</button>
    </form>
    <form class="new-project" id="new-project">
      <label for="project-client">Client</label>
      <select id="project-client" name="project-client"></select>
      <label for="project-name">Project name</label>
      <input type="text" id="project-name" name="project-name" autocomplete="off" maxlength="100">
      <label for="project-rate">Hourly rate (£)</label>
      <input type="number" id="project-rate" name="project-rate" min="0" step="0.01" value="0">
      <label class="billable-label">
        <input type="checkbox" id="project-billable" name="project-billable">
        Billable
      </label>
      <button type="button" id="add-project">Add project</button>
    </form>
    <p class="error" id="error" role="alert"></p>
    <ul id="client-list" class="client-list"></ul>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>
  <script type="module" src="src/clients-page.mjs"></script>
</body>
</html>
